# This is for STM32L4R5 Nucleo Dev Boards.
source [find interface/stlink-dap.cfg]

# [Falcon_FxP_M4] pin the ST-Link probe by serial when STLINK_SERIAL is
# set (the build host has more than one probe attached).
if { [info exists ::env(STLINK_SERIAL)] } {
    adapter serial $::env(STLINK_SERIAL)
}

transport select dapdirect_swd

source [find target/stm32l4x.cfg]

# use hardware reset (srst seems to be problematic)
reset_config trst_only
